<!DOCTYPE html>
<html lang="en" class="bg-[#f4f6f9] text-[#2c3e50]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Footprint Adjudication System</title>
    <!-- Google Fonts: Space Grotesk for headings, JetBrains Mono for data/UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['JetBrains Mono', 'monospace'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        base: {
                            900: '#ffffff',
                            800: '#f8f9fa',
                            700: '#e9ecef',
                            600: '#dee2e6',
                        },
                        accent: {
                            DEFAULT: '#0d6efd',
                            muted: 'rgba(13, 110, 253, 0.08)',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-position: center center;
            background-color: #f4f6f9;
        }

        .title-hover:hover {
            color: #0d6efd;
            transition: color 0.3s ease;
        }

        /* Utilitarian Button */
        .btn-utilitarian {
            position: relative;
            background: #ffffff;
            color: #495057;
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
            border-radius: 4px;
        }
        
        .btn-utilitarian::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background-color: transparent;
            transition: background-color 0.2s ease;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .btn-utilitarian:hover, .btn-utilitarian:focus-visible {
            background-color: #f8f9fa;
            border-color: #0d6efd;
            color: #0d6efd;
            outline: none;
        }

        .btn-accent {
            color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-accent::before {
            background-color: #0d6efd;
        }
        
        .btn-accent:hover, .btn-accent:focus-visible {
            background-color: rgba(13, 110, 253, 0.08);
            border-color: #0d6efd;
            color: #0d6efd;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-accent selection:text-white bg-[#f4f6f9]">
    
    <main class="w-full max-w-2xl relative">
        <!-- Structural corner accents -->
        <div class="absolute -top-4 -left-4 w-8 h-8 border-t-2 border-l-2 border-gray-300" aria-hidden="true"></div>
        <div class="absolute -top-4 -right-4 w-8 h-8 border-t-2 border-r-2 border-gray-300" aria-hidden="true"></div>
        <div class="absolute -bottom-4 -left-4 w-8 h-8 border-b-2 border-l-2 border-gray-300" aria-hidden="true"></div>
        <div class="absolute -bottom-4 -right-4 w-8 h-8 border-b-2 border-r-2 border-gray-300" aria-hidden="true"></div>

        <article class="bg-white border border-gray-200 p-8 sm:p-12 text-center relative z-10 shadow-lg rounded-lg">
            <div class="mt-2 mb-6 inline-flex items-center justify-center w-16 h-16 border border-accent bg-accent-muted text-accent rounded-full">
                <i class="fas fa-shield-halved text-2xl" aria-hidden="true"></i>
            </div>
            
            <h1 class="font-display text-xl sm:text-2xl font-bold tracking-tight text-gray-800 mb-3 title-hover transition-colors duration-200 uppercase">
                Machine Learning & Cyber Threat Intelligence
            </h1>
            <p class="text-xs tracking-[0.1em] text-gray-500 uppercase mb-8 max-w-md mx-auto">
                For Secure Digital Footprint Adjudication
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('user.home') }}" 
                   class="btn-utilitarian btn-accent w-full sm:w-auto px-10 py-3.5 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-3"
                   aria-label="Enter Digital Footprint Adjudication Dashboard">
                    <span>Enter Dashboard</span>
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </a>
                <a href="{{ url_for('auth.logout') }}" 
                   class="text-[10px] font-bold text-gray-400 hover:text-accent transition-colors uppercase tracking-widest mt-4 sm:mt-0 ml-0 sm:ml-4">
                    Sign Out
                </a>
                {% else %}
                <a href="{{ url_for('auth.login') }}" 
                   class="btn-utilitarian btn-accent w-full sm:w-auto px-10 py-3.5 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-3"
                   aria-label="Sign in to system">
                    <span>Sign In</span>
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                </a>
                <a href="{{ url_for('auth.register') }}" 
                   class="btn-utilitarian w-full sm:w-auto px-10 py-3.5 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-3"
                   aria-label="Register new account">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus" aria-hidden="true"></i>
                </a>
                {% endif %}
            </div>
        </article>
    </main>

</body>
</html>
